workflows:
  android-workflow:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      android_signing:
        - debug_keystore
      vars:
        PACKAGE_NAME: "com.example.quransunao"
    scripts:
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
