name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper & Config Exists
        run: |
          if [ ! -f "./gradlew" ] || ! head -1 "./gradlew" | grep -q "#!/"; then
            echo "Gradle wrapper missing or corrupted. Regenerating via official distribution..."
            rm -f gradlew gradlew.bat
            mkdir -p gradle/wrapper
            
            # Download and extract Gradle 8.5 to generate wrapper scripts cleanly
            curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
            ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
            rm -rf gradle-8.5 gradle-8.5-bin.zip
            
            if ! head -1 "./gradlew" | grep -q "#!/"; then
              echo "Failed to generate gradlew successfully."
              exit 1
            fi
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew --stop
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
