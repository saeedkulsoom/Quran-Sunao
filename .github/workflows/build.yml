name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper & Config Exists
        run: |
          if [ ! -f "./gradlew" ] || ! head -1 "./gradlew" | grep -q "#!/"; then
            echo "Gradle wrapper missing or corrupted. Regenerating..."
            rm -f gradlew gradlew.bat
            mkdir -p gradle/wrapper
            curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.5/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.5/gradlew -o gradlew
            curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.5/gradlew.bat -o gradlew.bat
            
            if ! head -1 "./gradlew" | grep -q "#!/"; then
              echo "Failed to download gradlew. Check repository state."
              exit 1
            fi
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew --stop
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
